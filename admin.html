<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | JONAS PREMIUM</title><link rel="stylesheet" href="./styles.css"><style>
.admin{max-width:1100px;margin:55px auto;padding:0 22px}.admin h1{font-size:34px}.admin-card{background:#f7f6f3;padding:24px;margin:20px 0}.admin-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.admin-form input,.admin-form select{min-width:0}.admin-form button{grid-column:1/-1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar select{max-width:220px}.reservation{background:#fff;border:1px solid #eee;padding:18px;margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.reservation p{font-size:12px;color:#777;line-height:1.7;margin:5px 0}.reservation strong{font-size:14px}.reservation-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.smallbtn{border:1px solid #ddd;background:#fff;padding:9px;font:11px Manrope;cursor:pointer}.danger{color:#c22}.hidden{display:none!important}.notice{font-size:12px;color:#777}@media(max-width:600px){.admin-form{grid-template-columns:1fr}.reservation{grid-template-columns:1fr}.reservation-actions{justify-content:flex-start}}
</style></head><body><header class="topbar"><a class="brand" href="./"><span class="brand-mark">J</span><span>JONAS <b>PREMIUM</b><small>ADMINISTRACIÓN</small></span></a><a href="./">Volver a la web ↗</a></header>
<main class="admin"><p class="eyebrow">ÁREA PRIVADA</p><h1>Gestión de solicitudes</h1><section id="login-panel" class="admin-card"><h2>Acceso del administrador</h2><p class="notice">Inicia sesión con el usuario autorizado en Supabase.</p><form id="login-form" class="admin-form"><input name="email" type="email" placeholder="Correo electrónico" required><input name="password" type="password" placeholder="Contraseña" required><button class="button button-red">Entrar</button></form><p id="login-msg" class="notice"></p></section>
<section id="dashboard" class="hidden"><div class="toolbar"><button id="logout" class="smallbtn">Cerrar sesión</button><select id="filter"><option value="all">Todos los estados</option><option value="pending">Pendientes</option><option value="confirmed">Confirmadas</option><option value="completed">Completadas</option><option value="cancelled">Canceladas</option></select><button id="refresh" class="smallbtn">Actualizar</button></div><p id="admin-msg" class="notice"></p><div id="reservations"></div></section></main>
<script type="module" src="./admin.js"></script></body></html>
